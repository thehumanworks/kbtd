[project]
name = "todo"
version = "0.1.0"
description = "A Markdown-backed Kanban CLI and terminal UI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Durable execution for watcher actions; imported only by watcher commands and the worker.
    "dbos>=3.7,<4",
]

[project.scripts]
kbtd = "kbtd.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kbtd"
module-root = ""
